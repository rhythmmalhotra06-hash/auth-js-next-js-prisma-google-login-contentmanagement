name: Hootsuite Perch metrics

# The automated half of the performance loop: pull per-post numbers from Hootsuite Perch
# and store them in `social_metrics`, so Studio's "Live & performing" band stays current
# without anyone running a pull by hand.
#
#   POST /api/metrics/perch-pull?windowDays=30   — Bearer-gated (SYNC_SECRET)
#
# Idempotent: rows are keyed by (source, post, window, captured day), so re-running
# updates in place rather than duplicating. Three windows are pulled — a 1-day one to
# catch the 24h numbers the team cares about, a 7-day one for the Wednesday weekly
# digest, and a 30-day one for the standing totals / Monday digest.
#
# Requires the integration to be connected once by an admin at /admin/hootsuite (that's
# where the OAuth grant and its refresh token come from). A 503 means it isn't connected
# or the grant was revoked — that needs a human, so the job fails loudly.
#
# The app is public (IAP removed 2026-07-03), so a plain bearer curl reaches the route.
# SYNC_SECRET is a repo secret; APP_URL a repo variable. Same convention as clip-learn.yml.

on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC daily, after the 03:00 metrics refresh
  workflow_dispatch:
    inputs:
      windowDays:
        description: 'Single window to pull (days). Leave blank for the usual 1 + 7 + 30.'
        required: false
        default: ''

concurrency:
  group: perch-metrics
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Perch metrics into social_metrics
        env:
          APP_URL: ${{ vars.APP_URL || 'https://auth-js-next-js-prisma-google-login-cont-73a7-jdtcvngavq-as.a.run.app' }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SINGLE: ${{ github.event.inputs.windowDays }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::SYNC_SECRET is not set in repo secrets"; exit 1
          fi

          windows="1 7 30"
          if [ -n "$SINGLE" ]; then windows="$SINGLE"; fi

          failed=0
          for w in $windows; do
            echo "→ POST $APP_URL/api/metrics/perch-pull?windowDays=$w"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$APP_URL/api/metrics/perch-pull?windowDays=$w" \
              -H "Authorization: Bearer $SYNC_SECRET")
            echo "HTTP $code"; cat /tmp/resp.json; echo
            case "$code" in
              200) : ;;
              503) echo "::error::Hootsuite is not connected (or the grant was revoked) — an admin must reconnect at /admin/hootsuite"; failed=1 ;;
              *)   echo "::error::perch-pull (windowDays=$w) returned HTTP $code"; failed=1 ;;
            esac
          done
          exit $failed
