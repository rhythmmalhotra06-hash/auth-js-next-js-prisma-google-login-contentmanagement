name: MOW pack to Slack

# Posts the Monday pack into Slack as the meeting starts (decision S11).
#
# 00:00 UTC Monday = 08:00 MYT, which is the meeting. The message is a POINTER with enough
# substance to read on a phone — headline, revenue split, what is not committed, and the link.
#
# It summarises whatever is in the pack at that moment. If the figures have not been ingested it
# says so rather than posting a cheerful link to nothing, which is the honest failure and also the
# fastest way for someone to notice and run `MOW weekly figures`.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      weekOf:
        description: 'Any date in the week to summarise. Blank = the week that just ended.'
        required: false
      dryRun:
        description: 'Compose without posting to Slack'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the pack
        env:
          APP_URL: ${{ vars.APP_URL || 'https://auth-js-next-js-prisma-google-login-cont-73a7-jdtcvngavq-as.a.run.app' }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          WEEK_OF: ${{ github.event.inputs.weekOf }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::SYNC_SECRET is not set in repo secrets"; exit 1
          fi
          q=""
          [ -n "$WEEK_OF" ] && q="?weekOf=$WEEK_OF"
          if [ "$DRY_RUN" = "true" ]; then
            if [ -z "$q" ]; then q="?dryRun=1"; else q="$q&dryRun=1"; fi
          fi
          echo "→ POST $APP_URL/api/mow/pack/notify$q"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$APP_URL/api/mow/pack/notify$q" \
            -H "Authorization: Bearer $SYNC_SECRET")
          echo "HTTP $code"; cat /tmp/resp.json; echo
          [ "$code" = "200" ] || { echo "::error::pack notify failed (HTTP $code)"; exit 1; }
